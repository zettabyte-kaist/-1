<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Forge — 원소 합성사</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: #0f0f1a;
  color: #e0e0e0;
  min-height: 100vh;
}

#app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
}

/* Header */
#header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 12px 20px;
  margin-bottom: 14px;
}

#header h1 { font-size: 1.3rem; color: #7ec8e3; }

.stat-box {
  display: flex;
  gap: 20px;
}

.stat {
  text-align: center;
}
.stat-label {
  font-size: 0.65rem;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.stat-value {
  font-size: 1.1rem;
  font-weight: bold;
  color: #f0d060;
}
.stat-value.danger { color: #ff6b6b; }
.stat-value.ok { color: #6bff8a; }

/* Main layout */
#main {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 14px;
}

/* Left panel */
#left-panel { display: flex; flex-direction: column; gap: 14px; }

/* Hand area */
#hand-area {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 14px;
}
#hand-area h3 { font-size: 0.85rem; color: #7ec8e3; margin-bottom: 10px; }

#hand-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 80px;
}

.element-card {
  width: 62px;
  height: 80px;
  border-radius: 8px;
  border: 2px solid #444;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s;
  user-select: none;
  position: relative;
}
.element-card:hover { transform: translateY(-3px); }
.element-card.selected {
  border-color: #7ec8e3;
  box-shadow: 0 0 10px #7ec8e380;
  transform: translateY(-6px);
}
.element-card.used { opacity: 0.3; cursor: default; pointer-events: none; }

.card-symbol {
  font-size: 1.4rem;
  font-weight: bold;
  line-height: 1;
}
.card-name {
  font-size: 0.55rem;
  color: #aaa;
  margin-top: 2px;
}
.card-num {
  font-size: 0.6rem;
  color: #888;
  position: absolute;
  bottom: 4px;
  right: 6px;
}

/* Grade colors */
.grade-1 { background: #1a2a1a; border-color: #3a6a3a; }
.grade-1 .card-symbol { color: #6bff8a; }
.grade-2 { background: #1a1a3a; border-color: #3a3a8a; }
.grade-2 .card-symbol { color: #7ec8e3; }
.grade-3 { background: #2a1a3a; border-color: #6a3a8a; }
.grade-3 .card-symbol { color: #c07ee3; }
.grade-4 { background: #3a2a1a; border-color: #8a6a3a; }
.grade-4 .card-symbol { color: #f0d060; }

/* Builder */
#builder-area {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 14px;
}
#builder-area h3 { font-size: 0.85rem; color: #7ec8e3; margin-bottom: 10px; }

#selected-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 40px;
  background: #111122;
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 10px;
}

.selected-chip {
  background: #2a3a5a;
  border: 1px solid #3a5a8a;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 0.8rem;
  color: #7ec8e3;
}

#compound-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 200px;
  overflow-y: auto;
  margin-bottom: 10px;
}

.compound-option {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111122;
  border: 1px solid #2a2a4a;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}
.compound-option:hover {
  background: #1a2a4a;
  border-color: #7ec8e3;
}

.compound-option .comp-name { font-size: 0.85rem; }
.compound-option .comp-formula { font-size: 0.8rem; color: #888; }
.compound-option .comp-score {
  font-size: 0.85rem;
  color: #f0d060;
  font-weight: bold;
}
.comp-category {
  font-size: 0.65rem;
  padding: 1px 5px;
  border-radius: 3px;
  background: #2a2a4a;
  color: #aaa;
  margin-left: 6px;
}

#builder-hint {
  font-size: 0.75rem;
  color: #666;
  font-style: italic;
}

/* Formed compounds this turn */
#formed-area {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 14px;
}
#formed-area h3 { font-size: 0.85rem; color: #7ec8e3; margin-bottom: 10px; }

#formed-list { display: flex; flex-direction: column; gap: 6px; }

.formed-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111122;
  border: 1px solid #2a3a2a;
  border-radius: 6px;
  padding: 6px 10px;
}
.formed-item .fi-left { display: flex; align-items: center; gap: 8px; }
.formed-item .fi-name { font-size: 0.85rem; }
.formed-item .fi-formula { font-size: 0.8rem; color: #888; }
.formed-item .fi-score { font-size: 0.9rem; color: #f0d060; font-weight: bold; }

/* Action buttons */
#action-bar {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}

button {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: bold;
  transition: opacity 0.1s, transform 0.1s;
}
button:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
button:disabled { opacity: 0.4; cursor: default; }

.btn-primary { background: #3a7ae8; color: #fff; }
.btn-danger { background: #e83a3a; color: #fff; }
.btn-success { background: #3ae87a; color: #111; }
.btn-warning { background: #e8c03a; color: #111; }

/* Right panel */
#right-panel { display: flex; flex-direction: column; gap: 14px; }

#log-area {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 14px;
  max-height: 200px;
  overflow-y: auto;
}
#log-area h3 { font-size: 0.85rem; color: #7ec8e3; margin-bottom: 10px; }

.log-line {
  font-size: 0.78rem;
  color: #bbb;
  margin-bottom: 4px;
  line-height: 1.4;
}
.log-line.bonus { color: #7ec8e3; }
.log-line.error { color: #ff6b6b; }

/* Score panel */
#score-panel {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 14px;
}
#score-panel h3 { font-size: 0.85rem; color: #7ec8e3; margin-bottom: 10px; }

.score-line {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  padding: 4px 0;
  border-bottom: 1px solid #2a2a4a;
}
.score-line:last-child { border-bottom: none; }
.score-line .sl-label { color: #888; }
.score-line .sl-value { font-weight: bold; }
.score-line .sl-value.pass { color: #6bff8a; }
.score-line .sl-value.fail { color: #ff6b6b; }

/* Shop */
#shop-area {
  background: #1a1a2e;
  border: 1px solid #4a4a2a;
  border-radius: 10px;
  padding: 14px;
  display: none;
}
#shop-area.visible { display: block; }
#shop-area h3 { font-size: 0.85rem; color: #f0d060; margin-bottom: 10px; }

#shop-cards { display: flex; flex-direction: column; gap: 6px; }

.shop-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111122;
  border: 1px solid #4a4a2a;
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  transition: background 0.1s;
}
.shop-item:hover { background: #2a2a1a; border-color: #f0d060; }
.shop-item.bought { opacity: 0.4; pointer-events: none; }
.shop-item .si-sym { font-size: 1rem; font-weight: bold; }
.shop-item .si-name { font-size: 0.8rem; color: #aaa; }
.shop-item .si-cost { font-size: 0.8rem; color: #f0d060; font-weight: bold; }
.shop-item .si-num { font-size: 0.7rem; color: #888; }

/* Overlay states */
#phase-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#phase-overlay.visible { display: flex; }

.overlay-box {
  background: #1a1a2e;
  border: 2px solid #7ec8e3;
  border-radius: 16px;
  padding: 32px 40px;
  text-align: center;
  max-width: 400px;
}
.overlay-box h2 { font-size: 1.5rem; margin-bottom: 12px; }
.overlay-box p { color: #aaa; margin-bottom: 20px; }
.overlay-box.gameover { border-color: #ff6b6b; }
.overlay-box.gameover h2 { color: #ff6b6b; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }

/* Responsiveness */
@media (max-width: 700px) {
  #main { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>⚗️ Elemental Forge</h1>
    <div class="stat-box">
      <div class="stat">
        <div class="stat-label">턴</div>
        <div class="stat-value" id="turn-val">1</div>
      </div>
      <div class="stat">
        <div class="stat-label">구간 누적/목표</div>
        <div class="stat-value" id="threshold-val">0/100pt</div>
      </div>
      <div class="stat">
        <div class="stat-label">이번 턴 점수</div>
        <div class="stat-value danger" id="score-val">0pt</div>
      </div>
      <div class="stat">
        <div class="stat-label">연구 포인트</div>
        <div class="stat-value" id="rp-val">0pt</div>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="left-panel">
      <div id="hand-area">
        <h3>🃏 현재 손패</h3>
        <div id="hand-cards"></div>
      </div>
      <div id="builder-area">
        <h3>🧪 화합물 합성</h3>
        <div id="selected-preview"></div>
        <div id="compound-list"></div>
        <div id="builder-hint">카드를 선택하면 만들 수 있는 화합물이 표시됩니다.</div>
      </div>
      <div id="formed-area">
        <h3>✅ 이번 턴 합성된 화합물</h3>
        <div id="formed-list"></div>
        <div id="action-bar" style="margin-top:12px"></div>
      </div>
    </div>
    <div id="right-panel">
      <div id="score-panel">
        <h3>📊 득점 현황</h3>
        <div id="score-lines"></div>
      </div>
      <div id="log-area">
        <h3>📋 로그</h3>
        <div id="log-lines"></div>
      </div>
      <div id="shop-area">
        <h3>🛒 연구 상점</h3>
        <p style="font-size:0.75rem;color:#888;margin-bottom:10px">연구 포인트로 새 원소 카드 구매 (덱에 추가)</p>
        <div id="shop-cards"></div>
      </div>
    </div>
  </div>
</div>
<div id="phase-overlay">
  <div class="overlay-box">
    <h2 id="overlay-title">게임 오버</h2>
    <p id="overlay-msg"></p>
    <button class="btn-primary" id="overlay-btn">다시 시작</button>
  </div>
</div>
<script>

  { id: 'H2O',     name: '물',           formula: 'H₂O',      elements: {H:2, O:1},       category: 'oxide',        score: 10,  grade: 1 },

const COMBUSTION_RULES = [

const CATALYST_RULES = [
  { catalyst: 'H2SO4', targets: ['organic_acid','alcohol','aldehyde','ester','hydrocarbon','sugar'], multiplier: 1.3 },
  { catalyst: 'Fe2O3', targets: ['oxide'], multiplier: 1.2 },

// Industrial synthesis routes
const SYNTHESIS_ROUTES = [
  { name: '하버-보슈법', requires: ['NH3'], elementCards: ['N'], bonus: 50 },
  { name: '접촉법',      requires: ['SO2','SO3','H2SO4'], bonus: 60 },

  { name: '석회 제조',   requires: ['CaCO3','CaO','CaOH2'], bonus: 40 },
];

// Per-turn thresholds (kept for reference / display only)
const THRESHOLDS = [30, 55, 85, 125, 175, 240];

// 5-turn period thresholds (cumulative score required per period)
// Period 1: turns 1-5, Period 2: turns 6-10, etc.
const PERIOD_THRESHOLDS = [100, 280, 560, 1100, 2000];
// After period 5, each next period threshold = previous × 2.0

// Shop costs by grade
const SHOP_COSTS = { 1: 0, 2: 20, 3: 45, 4: 85, 5: 150 };

// Homologous series definitions for 7-11 synergy
const HOMOLOGOUS_SERIES = [
  { name: '알케인', ids: ['CH4','C2H6','C3H8'],        bonus: 10 },
  { name: '알켄',   ids: ['C2H4','C2H2'],              bonus: 10 },
  { name: '알코올', ids: ['CH3OH','C2H5OH'],           bonus: 12 },
  { name: '유기산', ids: ['HCOOH','CH3COOH'],          bonus: 12 },
  { name: '알데하이드', ids: ['HCHO','CH3CHO'],        bonus: 10 },
];
// Game Engine

class GameState {
  constructor() {
    this.turn = 1;
    this.researchPoints = 0;
    this.totalResearchPoints = 0;
    this.deck = this.buildInitialDeck();
    this.hand = [];
    this.discard = [];
    this.formedCompounds = [];
    this.usedElementIds = new Set();
    this.turnScore = 0;
    this.log = [];
    this.gameOver = false;
    this.phase = 'draw';
    this.shopCards = [];
    this.interactionsThisTurn = new Set();
    this.bonusLines = [];
    // 5-turn period tracking
    this.periodScore = 0;   // cumulative score within current period
    this.periodTurn = 0;    // turns completed in current period (0-4)
    this.periodNum = 1;     // which period we're in (1-based)
  }

  buildInitialDeck() {
    const cards = [];
    let id = 0;
    const add = (sym, count) => {
      for (let i = 0; i < count; i++) cards.push({ id: id++, symbol: sym });
    };
    add('H', 5);
    add('C', 4);
    add('O', 3);
    return shuffle(cards);
  }

  getThreshold() {
    if (this.turn <= THRESHOLDS.length) return THRESHOLDS[this.turn - 1];
    let t = THRESHOLDS[THRESHOLDS.length - 1];
    for (let i = THRESHOLDS.length; i < this.turn; i++) t = Math.round(t * 1.4);
    return t;
  }

  getPeriodThreshold() {
    const idx = Math.min(this.periodNum - 1, PERIOD_THRESHOLDS.length - 1);
    if (this.periodNum <= PERIOD_THRESHOLDS.length) return PERIOD_THRESHOLDS[idx];
    let t = PERIOD_THRESHOLDS[PERIOD_THRESHOLDS.length - 1];
    for (let i = PERIOD_THRESHOLDS.length; i < this.periodNum; i++) t = Math.round(t * 2.0);
    return t;
  }

  drawPhase() {
    if (this.deck.length < 8) {
      this.deck = shuffle([...this.deck, ...this.discard]);
      this.discard = [];
    }
    this.hand = this.deck.splice(0, 8);
    this.formedCompounds = [];
    this.usedElementIds = new Set();
    this.turnScore = 0;
    this.interactionsThisTurn = new Set();
    this.bonusLines = [];
    this.log = [];
    this.phase = 'build';
  }

  // Try to form a compound from selected card ids
  formCompound(cardIds, compoundId) {
    const compound = COMPOUNDS.find(c => c.id === compoundId);
    if (!compound) return { ok: false, msg: '알 수 없는 화합물' };

    // Check no card already used
    for (const id of cardIds) {
      if (this.usedElementIds.has(id)) return { ok: false, msg: '이미 사용된 카드' };
    }

    // Count symbols from selected cards
    const selectedCards = this.hand.filter(c => cardIds.includes(c.id));
    const symbolCount = {};
    for (const card of selectedCards) {
      symbolCount[card.symbol] = (symbolCount[card.symbol] || 0) + 1;
    }

    // Validate against compound requirements
    for (const [sym, needed] of Object.entries(compound.elements)) {
      if ((symbolCount[sym] || 0) < needed) {
        return { ok: false, msg: `${sym} 부족 (필요: ${needed})` };
      }
    }
    // Check no extra cards
    const totalNeeded = Object.values(compound.elements).reduce((a, b) => a + b, 0);
    if (cardIds.length !== totalNeeded) {
      return { ok: false, msg: `카드 수 불일치 (필요: ${totalNeeded}장)` };
    }

    // Mark cards as used
    for (const id of cardIds) this.usedElementIds.add(id);

    // Add to formed compounds
    const existing = this.formedCompounds.find(fc => fc.compound.id === compoundId);
    if (existing) {
      existing.count++;
    } else {
      this.formedCompounds.push({ compound, count: 1 });
    }

    this.log.push(`✅ ${compound.name} (${compound.formula}) 합성! 기본 ${compound.score}점`);
    return { ok: true };
  }

  // Calculate final score for the turn
  scorePhase() {
    if (this.formedCompounds.length === 0) {
      this.turnScore = 0;
      this.phase = 'score';
      return;
    }

    const formed = this.formedCompounds;
    const compoundMap = {}; // id -> {compound, count, score, bonuses}
    for (const fc of formed) {
      compoundMap[fc.compound.id] = {
        compound: fc.compound,
        count: fc.count,
        baseScore: fc.compound.score * fc.count,
        bonusScore: 0,
        multiplier: 1.0,
      };
    }

    const allIds = new Set(formed.map(fc => fc.compound.id));
    const allCategories = formed.flatMap(fc =>
      Array(fc.count).fill(fc.compound.category)
    );

    // ── 7-2 Category Synergy ──
    const catCounts = {};
    for (const cat of allCategories) catCounts[cat] = (catCounts[cat] || 0) + 1;
    const CAT_BONUS = {
      acid: [2, 8], base: [2, 8], salt: [2, 10],
      oxide: [3, 5], hydrocarbon: [2, 8], alcohol: [2, 10],
      organic_acid: [2, 12], ester: [2, 15],
    };
    for (const [cat, [minCount, bonus]] of Object.entries(CAT_BONUS)) {
      if ((catCounts[cat] || 0) >= minCount) {
        this.interactionsThisTurn.add('category_synergy');
        const affected = formed.filter(fc => fc.compound.category === cat);
        for (const fc of affected) {
          const b = bonus * fc.count;
          compoundMap[fc.compound.id].bonusScore += b;
          this.bonusLines.push(`📦 분류 시너지 [${cat}]: ${fc.compound.name} +${b}pt`);
        }
      }
    }

    // ── 7-3 Neutralization ──
    for (const pair of NEUTRALIZATION_PAIRS) {
      if (allIds.has(pair.acid) && allIds.has(pair.base)) {
        this.interactionsThisTurn.add('neutralization');
        const acidEntry = compoundMap[pair.acid];
        const baseEntry = compoundMap[pair.base];
        acidEntry.bonusScore += 15;
        baseEntry.bonusScore += 15;
        this.bonusLines.push(`⚗️ 중화 반응: ${acidEntry.compound.name}+${baseEntry.compound.name} 각 +15pt`);
      }
    }

    // ── 7-1 Reaction Chain ──
    for (const chain of REACTION_CHAINS) {
      if (chain.reactants.every(r => allIds.has(r))) {
        const product = COMPOUNDS.find(c => c.id === chain.product);
        if (product && !allIds.has(product.id)) {
          this.interactionsThisTurn.add('reaction_chain');
          const chainScore = Math.round(product.score * 0.5);
          if (!compoundMap[product.id]) {
            compoundMap[product.id] = { compound: product, count: 0, baseScore: 0, bonusScore: chainScore, multiplier: 1.0 };
          } else {
            compoundMap[product.id].bonusScore += chainScore;
          }
          this.bonusLines.push(`🔗 반응 연계 [${chain.label}]: +${chainScore}pt`);
        }
      }
    }

    // ── 7-7 Combustion ──
    const co2Count = (compoundMap['CO2']?.count || 0);
    const h2oCount = (compoundMap['H2O']?.count || 0);
    for (const rule of COMBUSTION_RULES) {
      if (allIds.has(rule.organic) && co2Count >= rule.co2 && h2oCount >= rule.h2o) {
        this.interactionsThisTurn.add('combustion');
        const entry = compoundMap[rule.organic];
        const oldBase = entry.baseScore;
        entry.multiplier *= rule.multiplier;
        this.bonusLines.push(`🔥 연소 반응: ${entry.compound.name} ×${rule.multiplier}`);
      }
    }

    // ── 7-4 Catalyst ──
    for (const rule of CATALYST_RULES) {
      if (allIds.has(rule.catalyst)) {
        this.interactionsThisTurn.add('catalyst');
        const catalystEntry = compoundMap[rule.catalyst];
        // Catalyst itself at 0.5x
        catalystEntry.multiplier *= 0.5;
        // Boost targets
        for (const entry of Object.values(compoundMap)) {
          if (entry.compound.id !== rule.catalyst && rule.targets.includes(entry.compound.category)) {
            entry.multiplier *= rule.multiplier;
            this.bonusLines.push(`⚡ 촉매 [${compoundMap[rule.catalyst].compound.name}→${entry.compound.name}] ×${rule.multiplier}`);
          }
        }
      }
    }

    // ── 7-11 Homologous Series Synergy ──
    for (const series of HOMOLOGOUS_SERIES) {
      const matches = series.ids.filter(id => allIds.has(id));
      if (matches.length >= 2) {
        this.interactionsThisTurn.add('homologous_series');
        const mult = matches.length >= 3 ? 2 : 1;
        for (const id of matches) {
          const b = series.bonus * mult * (compoundMap[id]?.count || 1);
          if (compoundMap[id]) compoundMap[id].bonusScore += b;
          this.bonusLines.push(`🧬 동족체 [${series.name}]: ${COMPOUNDS.find(c=>c.id===id)?.name} +${b}pt`);
        }
      }
    }

    // ── 7-12 Industrial Synthesis Routes ──
    for (const route of SYNTHESIS_ROUTES) {
      const reqs = route.requires;
      if (reqs.every(r => allIds.has(r))) {
        this.interactionsThisTurn.add('synthesis_route');
        this.bonusLines.push(`🏭 산업 합성 루트 [${route.name}]: +${route.bonus}pt`);
        // Add bonus as flat
        const firstEntry = Object.values(compoundMap)[0];
        firstEntry.bonusScore += route.bonus;
      }
    }

    // ── 7-13 Combo Multiplier ──
    const comboCount = this.interactionsThisTurn.size;
    const COMBO_MULT = [1.0, 1.0, 1.2, 1.5, 1.8, 2.5];
    const comboMult = COMBO_MULT[Math.min(comboCount, COMBO_MULT.length - 1)];
    // update interaction display name

    if (comboCount >= 2) {
      this.bonusLines.push(`✨ 콤보 배율 (${comboCount}종): ×${comboMult}`);
    }

    // Sum all scores
    let total = 0;
    for (const entry of Object.values(compoundMap)) {
      const s = Math.round((entry.baseScore + entry.bonusScore) * entry.multiplier);
      total += s;
    }
    this.turnScore = Math.round(total * comboMult);

    // Discard used cards
    for (const card of this.hand) {
      if (this.usedElementIds.has(card.id)) {
        this.discard.push(card);
      }
    }
    // Unused cards also discarded
    for (const card of this.hand) {
      if (!this.usedElementIds.has(card.id)) {
        this.discard.push(card);
      }
    }

    this.phase = 'score';
  }

  judgePhase() {
    this.periodScore += this.turnScore;
    this.periodTurn++;

    const isEndOfPeriod = this.periodTurn === 5;

    if (isEndOfPeriod) {
      const target = this.getPeriodThreshold();
      if (this.periodScore >= target) {
        const earned = this.periodScore - target;
        this.researchPoints += earned;
        this.totalResearchPoints += earned;
        this.log.push(`🎉 ${this.periodNum}기 통과! 누적 ${this.periodScore}pt / 목표 ${target}pt`);
        this.log.push(`💰 +${earned} 연구 포인트 획득`);
        this.periodNum++;
        this.periodScore = 0;
        this.periodTurn = 0;
        this.generateShop();
        this.phase = 'shop';
      } else {
        this.log.push(`💀 ${this.periodNum}기 실패. 누적 ${this.periodScore}pt / 목표 ${target}pt`);
        this.gameOver = true;
        this.phase = 'gameover';
      }
    } else {
      const target = this.getPeriodThreshold();
      const remaining = 5 - this.periodTurn;
      this.log.push(`📈 이번 턴 ${this.turnScore}pt → 구간 누적 ${this.periodScore}pt (목표 ${target}pt, 남은 턴 ${remaining})`);
      this.phase = 'nextturn';
    }
  }

  generateShop() {
    // Determine available grades
    const maxGrade = this.turn >= 10 ? 4 : this.turn >= 5 ? 3 : 2;
    const pool = Object.entries(ELEMENTS)
      .filter(([sym, el]) => el.grade >= 2 && el.grade <= maxGrade)
      .map(([sym]) => sym);
    // Pick 4 random
    const shuffled = shuffle([...pool]);
    this.shopCards = shuffled.slice(0, 4).map(sym => ({
      symbol: sym,
      element: ELEMENTS[sym],
      cost: SHOP_COSTS[ELEMENTS[sym].grade],
    }));
  }

  buyCard(symbol) {
    const shopItem = this.shopCards.find(c => c.symbol === symbol);
    if (!shopItem) return { ok: false, msg: '상점에 없는 원소' };
    if (this.researchPoints < shopItem.cost) return { ok: false, msg: '연구 포인트 부족' };
    this.researchPoints -= shopItem.cost;
    // Add to discard pile
    const newId = Date.now() + Math.random();
    this.discard.push({ id: newId, symbol });
    this.log.push(`🛒 ${ELEMENTS[symbol].name}(${symbol}) 획득!`);
    // Remove from shop
    this.shopCards = this.shopCards.filter(c => c.symbol !== symbol);
    return { ok: true };
  }

  nextTurn() {
    this.turn++;
    this.hand = [];
    this.phase = 'draw';
  }

  // Get all valid compounds formable from a given multiset of symbols
  getFormableCompounds(symbolCounts) {
    return COMPOUNDS.filter(c => {
      for (const [sym, needed] of Object.entries(c.elements)) {
        if ((symbolCounts[sym] || 0) < needed) return false;
      }
      const total = Object.values(c.elements).reduce((a, b) => a + b, 0);
      const available = Object.values(symbolCounts).reduce((a, b) => a + b, 0);
      return total <= available;
    });
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// UI Controller

let gs = null;
let selectedCardIds = [];

function init() {
  gs = new GameState();
  gs.drawPhase();
  render();
}

function render() {
  renderHeader();
  renderHand();
  renderBuilder();
  renderFormed();
  renderLog();
  renderScore();
  renderShop();
  renderActions();
}

function renderHeader() {
  document.getElementById('turn-val').textContent = gs.turn;
  // Show period progress instead of per-turn threshold
  const target = gs.getPeriodThreshold();
  const tv = document.getElementById('threshold-val');
  tv.textContent = `${gs.periodScore}/${target}pt`;
  const rv = document.getElementById('rp-val');
  rv.textContent = gs.researchPoints + 'pt';
  const sv = document.getElementById('score-val');
  sv.textContent = gs.turnScore + 'pt';
  // Color based on whether period is on track
  const turnsLeft = 5 - gs.periodTurn;
  const needed = target - gs.periodScore;
  const onTrack = turnsLeft > 0 ? (needed / turnsLeft <= 80) : gs.periodScore >= target;
  sv.className = 'stat-value ' + (onTrack ? 'ok' : 'danger');
}

function renderHand() {
  const container = document.getElementById('hand-cards');
  container.innerHTML = '';
  for (const card of gs.hand) {
    const el = ELEMENTS[card.symbol];
    const div = document.createElement('div');
    const isUsed = gs.usedElementIds.has(card.id);
    const isSelected = selectedCardIds.includes(card.id);
    div.className = `element-card grade-${el.grade}${isUsed ? ' used' : ''}${isSelected ? ' selected' : ''}`;
    div.innerHTML = `
      <span class="card-symbol">${card.symbol}</span>
      <span class="card-name">${el.name}</span>
      <span class="card-num">${el.atomicNum}</span>
    `;
    if (!isUsed) {
      div.addEventListener('click', () => toggleCard(card.id));
    }
    container.appendChild(div);
  }
  if (gs.hand.length === 0 && gs.phase === 'build') {
    container.innerHTML = '<span style="color:#555;font-size:0.8rem">카드가 없습니다.</span>';
  }
}

function toggleCard(cardId) {
  if (gs.phase !== 'build') return;
  const idx = selectedCardIds.indexOf(cardId);
  if (idx >= 0) {
    selectedCardIds.splice(idx, 1);
  } else {
    selectedCardIds.push(cardId);
  }
  renderBuilder();
  renderHand();
}

function renderBuilder() {
  const preview = document.getElementById('selected-preview');
  const compoundList = document.getElementById('compound-list');
  const hint = document.getElementById('builder-hint');

  // Show selected card chips
  preview.innerHTML = '';
  const symCount = {};
  for (const id of selectedCardIds) {
    const card = gs.hand.find(c => c.id === id);
    if (card) symCount[card.symbol] = (symCount[card.symbol] || 0) + 1;
  }
  if (selectedCardIds.length === 0) {
    preview.innerHTML = '<span style="color:#444;font-size:0.75rem">카드를 선택하세요</span>';
  }
  for (const [sym, cnt] of Object.entries(symCount)) {
    const chip = document.createElement('span');
    chip.className = 'selected-chip';
    chip.textContent = cnt > 1 ? `${sym}×${cnt}` : sym;
    preview.appendChild(chip);
  }

  // Show formable compounds
  compoundList.innerHTML = '';
  if (selectedCardIds.length === 0) {
    hint.textContent = '카드를 선택하면 만들 수 있는 화합물이 표시됩니다.';
    return;
  }

  const total = Object.values(symCount).reduce((a, b) => a + b, 0);
  const available = COMPOUNDS.filter(c => {
    const needed = Object.values(c.elements).reduce((a, b) => a + b, 0);
    if (needed !== total) return false;
    for (const [sym, cnt] of Object.entries(c.elements)) {
      if ((symCount[sym] || 0) < cnt) return false;
    }
    return true;
  });

  if (available.length === 0) {
    hint.textContent = '선택한 카드로 만들 수 있는 화합물이 없습니다.';
    return;
  }
  hint.textContent = '아래 화합물 중 하나를 클릭해 합성하세요.';

  for (const c of available) {
    const div = document.createElement('div');
    div.className = 'compound-option';
    const catLabel = getCatLabel(c.category);
    div.innerHTML = `
      <div class="fi-left">
        <span class="comp-name">${c.name}</span>
        <span class="comp-formula">${c.formula}</span>
        <span class="comp-category">${catLabel}</span>
      </div>
      <span class="comp-score">${c.score}pt</span>
    `;
    div.addEventListener('click', () => formCompound(c.id));
    compoundList.appendChild(div);
  }
}

function formCompound(compoundId) {
  if (gs.phase !== 'build') return;
  const result = gs.formCompound(selectedCardIds, compoundId);
  if (!result.ok) {
    addLogLine('❌ ' + result.msg, 'error');
    return;
  }
  selectedCardIds = [];
  renderLog();
  renderHand();
  renderBuilder();
  renderFormed();
  renderActions();
}

function renderFormed() {
  const list = document.getElementById('formed-list');
  list.innerHTML = '';
  if (gs.formedCompounds.length === 0) {
    list.innerHTML = '<span style="color:#555;font-size:0.8rem">아직 합성한 화합물이 없습니다.</span>';
    return;
  }
  for (const fc of gs.formedCompounds) {
    const div = document.createElement('div');
    div.className = 'formed-item';
    div.innerHTML = `
      <div class="fi-left">
        <span class="fi-name">${fc.compound.name}</span>
        <span class="fi-formula">${fc.compound.formula}</span>
        ${fc.count > 1 ? `<span style="color:#f0d060;font-size:0.75rem">×${fc.count}</span>` : ''}
      </div>
      <span class="fi-score">${fc.compound.score * fc.count}pt</span>
    `;
    list.appendChild(div);
  }
}

function renderLog() {
  const logArea = document.getElementById('log-lines');
  logArea.innerHTML = '';
  for (const line of gs.log) {
    addLogLine(line);
  }
  for (const line of gs.bonusLines) {
    addLogLine(line, 'bonus');
  }
  logArea.scrollTop = logArea.scrollHeight;
}

function addLogLine(text, cls = '') {
  const logArea = document.getElementById('log-lines');
  const div = document.createElement('div');
  div.className = 'log-line ' + cls;
  div.textContent = text;
  logArea.appendChild(div);
  logArea.scrollTop = logArea.scrollHeight;
}

function renderScore() {
  const panel = document.getElementById('score-lines');
  panel.innerHTML = '';

  const target = gs.getPeriodThreshold();
  const addLine = (label, value, cls = '') => {
    const div = document.createElement('div');
    div.className = 'score-line';
    div.innerHTML = `<span class="sl-label">${label}</span><span class="sl-value ${cls}">${value}</span>`;
    panel.appendChild(div);
  };

  // Period info always visible
  addLine(`${gs.periodNum}기 목표`, target + 'pt');
  addLine('구간 누적', gs.periodScore + 'pt', gs.periodScore >= target ? 'pass' : '');
  addLine('구간 내 턴', `${gs.periodTurn}/5`);

  if (gs.phase === 'build') {
    const base = gs.formedCompounds.reduce((s, fc) => s + fc.compound.score * fc.count, 0);
    addLine('현재 기본 점수', base + 'pt');
    addLine('보너스', '채점 후 계산');
  } else if (['score','shop','nextturn'].includes(gs.phase)) {
    addLine('이번 턴 득점', gs.turnScore + 'pt');
    if (gs.phase === 'shop') {
      const earned = gs.researchPoints;
      addLine('보유 연구 포인트', gs.researchPoints + 'pt');
    }
  }

  if (gs.interactionsThisTurn.size > 0) {
    const names = [...gs.interactionsThisTurn].map(i => getInteractionName(i)).join(', ');
    addLine('발동 상호작용', gs.interactionsThisTurn.size + '종');
    const div = document.createElement('div');
    div.style.cssText = 'font-size:0.7rem;color:#7ec8e3;padding:4px 0;';
    div.textContent = names;
    panel.appendChild(div);
  }
}

function renderShop() {
  const shopArea = document.getElementById('shop-area');
  const shopCards = document.getElementById('shop-cards');
  shopCards.innerHTML = '';

  if (gs.phase !== 'shop') {
    shopArea.classList.remove('visible');
    return;
  }
  shopArea.classList.add('visible');

  if (gs.shopCards.length === 0) {
    shopCards.innerHTML = '<span style="color:#555;font-size:0.8rem">상점이 비었습니다.</span>';
    return;
  }

  for (const item of gs.shopCards) {
    const div = document.createElement('div');
    div.className = 'shop-item';
    const canAfford = gs.researchPoints >= item.cost;
    if (!canAfford) div.style.opacity = '0.5';
    div.innerHTML = `
      <div class="fi-left">
        <span class="si-sym grade-${item.element.grade}" style="padding:2px 6px;border-radius:4px">${item.symbol}</span>
        <span class="si-name">${item.element.name}</span>
        <span class="si-num">Z=${item.element.atomicNum} | Grade ${item.element.grade}</span>
      </div>
      <span class="si-cost">${item.cost}pt</span>
    `;
    if (canAfford) {
      div.addEventListener('click', () => {
        const result = gs.buyCard(item.symbol);
        if (result.ok) {
          div.classList.add('bought');
          renderHeader();
          renderLog();
        }
      });
    }
    shopCards.appendChild(div);
  }
}

function renderActions() {
  const bar = document.getElementById('action-bar');
  bar.innerHTML = '';

  if (gs.phase === 'draw') {
    const btn = makeBtn('카드 드로우 (8장)', 'btn-primary', () => {
      gs.drawPhase();
      render();
    });
    bar.appendChild(btn);
  } else if (gs.phase === 'build') {
    if (selectedCardIds.length > 0) {
      const btn = makeBtn('선택 해제', 'btn-danger', () => {
        selectedCardIds = [];
        renderBuilder();
        renderHand();
      });
      bar.appendChild(btn);
    }
    const endBtn = makeBtn('합성 완료 → 채점', 'btn-success', () => {
      selectedCardIds = [];
      gs.scorePhase();
      gs.judgePhase();
      render();
    });
    endBtn.disabled = gs.formedCompounds.length === 0;
    bar.appendChild(endBtn);
  } else if (gs.phase === 'nextturn') {
    const remaining = 5 - gs.periodTurn;
    const btn = makeBtn(`다음 턴 (구간 ${remaining}턴 남음)`, 'btn-primary', () => {
      gs.nextTurn();
      gs.drawPhase();
      render();
    });
    bar.appendChild(btn);
  } else if (gs.phase === 'shop') {
    const btn = makeBtn('다음 턴으로 (새 구간 시작)', 'btn-warning', () => {
      gs.nextTurn();
      gs.drawPhase();
      render();
    });
    bar.appendChild(btn);
  } else if (gs.phase === 'gameover') {
    showGameOver();
  }
}

function makeBtn(label, cls, onClick) {
  const btn = document.createElement('button');
  btn.className = cls;
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function getCatLabel(cat) {
  const map = {
    oxide: '산화물', acid: '산', base: '염기', salt: '염',
    hydrocarbon: '탄화수소', alcohol: '알코올', organic_acid: '유기산',
    aldehyde: '알데하이드', ester: '에스터', sugar: '당류', oxidizer: '산화제',
  };
  return map[cat] || cat;
}

function getInteractionName(key) {
  const map = {
    category_synergy: '분류시너지', neutralization: '중화반응',
    reaction_chain: '반응연계', combustion: '연소반응',
    catalyst: '촉매', synthesis_route: '산업합성루트',
    homologous_series: '동족체시너지',
  };
  return map[key] || key;
}

function showGameOver() {
  document.getElementById('overlay-title').textContent = '게임 오버';
  document.getElementById('overlay-msg').innerHTML =
    `${gs.periodNum}기 ${gs.turn}턴에 탈락했습니다.<br>총 획득한 연구 포인트: ${gs.totalResearchPoints}pt`;
  document.getElementById('overlay-btn').textContent = '다시 시작';
  document.getElementById('overlay-btn').onclick = () => {
    document.getElementById('phase-overlay').classList.remove('visible');
    init();
  };
  const box = document.querySelector('.overlay-box');
  box.classList.add('gameover');
  box.classList.remove('success');
  document.getElementById('phase-overlay').classList.add('visible');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>

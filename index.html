<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덱빌딩 로그라이크</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    min-height: 100vh;
  }
  h1 { font-size: 1.4rem; margin-bottom: 16px; color: #a8d8ea; letter-spacing: 2px; }

  #score-display {
    font-size: 1.8rem;
    font-weight: bold;
    margin-bottom: 16px;
    color: #f9ca24;
  }

  #deck-info {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 16px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(5, 72px);
    grid-template-rows: repeat(5, 72px);
    gap: 6px;
    margin-bottom: 24px;
  }

  .card {
    width: 72px;
    height: 72px;
    border-radius: 8px;
    background: #16213e;
    border: 2px solid #0f3460;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: bold;
    transition: background 0.3s, border-color 0.3s;
    user-select: none;
  }
  .card.number { color: #e2e2e2; }
  .card.plus { color: #e84393; font-size: 2rem; }
  .card.highlight { background: #0f3460; border-color: #f9ca24; color: #f9ca24; }
  .card.empty { color: #333; }

  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  button {
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #draw-btn { background: #0f3460; color: #a8d8ea; border: 2px solid #a8d8ea; }
  #score-btn { background: #f9ca24; color: #1a1a2e; }

  #log {
    width: 390px;
    max-height: 180px;
    overflow-y: auto;
    background: #16213e;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.82rem;
    color: #ccc;
    line-height: 1.7;
  }
  #log p { border-bottom: 1px solid #0f3460; padding-bottom: 4px; margin-bottom: 4px; }
  #log p:last-child { border-bottom: none; margin-bottom: 0; }
  .log-score { color: #f9ca24; font-weight: bold; }
  .log-zero { color: #888; }
</style>
</head>
<body>
<h1>★ 덱빌딩 로그라이크 ★</h1>

<div id="score-display">점수: 0</div>
<div id="deck-info">덱: 25장 남음</div>

<div id="grid"></div>

<div class="buttons">
  <button id="draw-btn">드로우</button>
  <button id="score-btn" disabled>득점</button>
</div>

<div id="log"><p style="color:#888">드로우 버튼을 눌러 게임을 시작하세요.</p></div>

<script>
// --- 덱 초기화 ---
function makeInitialDeck() {
  const deck = [];
  for (let n = 1; n <= 5; n++)
    for (let i = 0; i < 4; i++) deck.push(n);
  for (let i = 0; i < 5; i++) deck.push('+');
  return deck;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// --- 상태 ---
let totalScore = 0;
let deck = shuffle(makeInitialDeck());
let grid = Array(25).fill(null); // null = 빈 칸
let drawn = false;

// --- DOM ---
const gridEl = document.getElementById('grid');
const drawBtn = document.getElementById('draw-btn');
const scoreBtn = document.getElementById('score-btn');
const scoreDisplay = document.getElementById('score-display');
const deckInfo = document.getElementById('deck-info');
const log = document.getElementById('log');

// --- 그리드 렌더링 ---
function renderGrid(highlightSet = new Set()) {
  gridEl.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    const val = grid[i];
    if (val === null) {
      card.classList.add('empty');
      card.textContent = '';
    } else if (val === '+') {
      card.classList.add('plus');
      card.textContent = '+';
    } else {
      card.classList.add('number');
      card.textContent = val;
    }
    if (highlightSet.has(i)) card.classList.add('highlight');
    gridEl.appendChild(card);
  }
}

// --- 줄 인덱스 ---
function getLines() {
  const lines = [];
  // 가로
  for (let r = 0; r < 5; r++) {
    lines.push([0,1,2,3,4].map(c => r*5+c));
  }
  // 세로
  for (let c = 0; c < 5; c++) {
    lines.push([0,1,2,3,4].map(r => r*5+c));
  }
  // 대각선 (좌상→우하)
  lines.push([0,6,12,18,24]);
  // 대각선 (우상→좌하)
  lines.push([4,8,12,16,20]);
  return lines;
}

// --- 수식 파싱 ---
// 연속된 "숫자 + 숫자 (+ 숫자)*" 패턴을 찾아 점수 계산
function parseExpressions(indices) {
  const vals = indices.map(i => grid[i]);
  const results = []; // { score, cellIndices }

  let i = 0;
  while (i < vals.length) {
    // 숫자로 시작하는지 확인
    if (typeof vals[i] === 'number') {
      // 앞뒤로 "+ 숫자" 패턴이 이어지는지 확인
      let j = i;
      while (j + 2 < vals.length && vals[j+1] === '+' && typeof vals[j+2] === 'number') {
        j += 2;
      }
      // j > i이면 유효한 수식 (최소 숫자 + 숫자)
      if (j > i) {
        const involved = indices.slice(i, j+1);
        const numbers = involved.filter((_, k) => k % 2 === 0).map(idx => grid[idx]);
        const score = numbers.reduce((a, b) => a + b, 0);
        const expr = involved.map(idx => grid[idx]).join(' ');
        results.push({ score, indices: involved, expr });
        i = j + 1;
      } else {
        i++;
      }
    } else {
      i++;
    }
  }
  return results;
}

// --- 드로우 ---
drawBtn.addEventListener('click', () => {
  if (deck.length < 25) {
    addLog('<span class="log-zero">덱이 부족합니다. (게임 준비 중)</span>');
    return;
  }
  grid = deck.splice(0, 25);
  drawn = true;
  renderGrid();
  updateDeckInfo();
  scoreBtn.disabled = false;
  drawBtn.disabled = true;
  addLog('카드 25장을 드로우했습니다.');
});

// --- 득점 ---
scoreBtn.addEventListener('click', () => {
  if (!drawn) return;

  const lines = getLines();
  const lineNames = [
    '가로1','가로2','가로3','가로4','가로5',
    '세로1','세로2','세로3','세로4','세로5',
    '대각↘','대각↙'
  ];

  // 모든 수식 수집
  const allExprs = [];
  lines.forEach((lineIdx, li) => {
    parseExpressions(lineIdx).forEach(({ score, indices, expr }) => {
      allExprs.push({ score, indices, expr, lineName: lineNames[li] });
    });
  });

  scoreBtn.disabled = true;
  drawn = false;

  if (allExprs.length === 0) {
    renderGrid();
    addLog('<span class="log-zero">이번 턴 득점 없음. (0점)</span>');
    finishRound(0);
    return;
  }

  let step = 0;
  let roundScore = 0;

  function showNext() {
    if (step > 0) renderGrid(); // 이전 하이라이트 제거
    if (step >= allExprs.length) {
      finishRound(roundScore);
      return;
    }
    const { score, indices, expr, lineName } = allExprs[step];
    roundScore += score;
    renderGrid(new Set(indices));
    addLog(`<span class="log-score">[${lineName}] ${expr} = ${score}점</span>`);
    step++;
    setTimeout(showNext, 700);
  }

  showNext();
});

function finishRound(roundScore) {
  totalScore += roundScore;
  scoreDisplay.textContent = `점수: ${totalScore}`;
  if (roundScore > 0)
    addLog(`<strong>이번 턴 합계: ${roundScore}점 → 총점: ${totalScore}점</strong>`);

  // 덱 리셋 (로그라이크: 새 덱으로 다음 라운드)
  if (deck.length < 25) {
    deck = shuffle(makeInitialDeck());
    updateDeckInfo();
    drawBtn.disabled = false;
    addLog('덱을 새로 섞었습니다. 다음 라운드 준비!');
  }
}

function updateDeckInfo() {
  deckInfo.textContent = `덱: ${deck.length}장 남음`;
}

function addLog(html) {
  const p = document.createElement('p');
  p.innerHTML = html;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
  // 처음 안내 메시지 제거
  const first = log.querySelector('p[style]');
  if (first && log.children.length > 1) first.remove();
}

renderGrid();
</script>
</body>
</html>

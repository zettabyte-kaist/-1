<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Forge — 원소 합성사</title>
  <style>
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f8f9fa;
  --color-border-secondary: #ced4da;
  --color-border-tertiary: #dee2e6;
  --color-text-primary: #212529;
  --color-text-secondary: #495057;
  --color-text-tertiary: #868e96;
  --border-radius-md: 6px;
  --border-radius-lg: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f1f3f5;
  color: var(--color-text-primary);
  min-height: 100vh;
}

body.dark {
  --color-background-primary: #1e1e2e;
  --color-background-secondary: #252538;
  --color-border-secondary: #45475a;
  --color-border-tertiary: #313244;
  --color-text-primary: #cdd6f4;
  --color-text-secondary: #a6adc8;
  --color-text-tertiary: #6c7086;
  background: #11111b;
}

#dark-toggle {
  position: fixed; bottom: 16px; right: 16px; z-index: 400;
  width: 40px; height: 40px; border-radius: 50%;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: background 0.2s;
}
#dark-toggle:hover { opacity: 0.8; }

#app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px 12px 60px;
}

/* Header */
#header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 12px 16px;
  margin-bottom: 12px;
}
#header h1 { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }

.stat-box { display: flex; gap: 20px; }
.stat { text-align: center; }
.stat-label { font-size: 10px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-value { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.stat-value.danger { color: #E24B4A; }
.stat-value.ok { color: #1D9E75; }

/* Main layout */
#main { display: grid; grid-template-columns: 1fr 300px; gap: 12px; }
#left-panel { display: flex; flex-direction: column; gap: 12px; }
#right-panel { display: flex; flex-direction: column; gap: 12px; }

/* Panel boxes */
#hand-area, #builder-area, #formed-area, #board-area,
#score-panel, #log-area, #shop-area {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 14px;
}
#hand-area h3, #builder-area h3, #formed-area h3, #board-area h3,
#score-panel h3, #log-area h3, #shop-area h3 {
  font-size: 11px; font-weight: 600; color: var(--color-text-tertiary);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
}

/* Hand cards */
#hand-cards { display: flex; flex-wrap: wrap; gap: 7px; min-height: 80px; }

.element-card {
  width: 62px; height: 84px;
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  user-select: none; position: relative;
}
.element-card:hover { border-color: var(--color-text-primary); transform: translateY(-2px); }
.element-card.selected { border: 2px solid #378ADD; }
.element-card.used { opacity: 0.25; cursor: default; pointer-events: none; }

.card-symbol { font-size: 1.3rem; font-weight: 600; line-height: 1; }
.card-name { font-size: 0.5rem; color: var(--color-text-tertiary); margin-top: 2px; }
.card-num { font-size: 0.55rem; color: var(--color-text-tertiary); position: absolute; bottom: 4px; right: 5px; }

/* Grade colors */
.grade-1 { background: #EAF3DE; border-color: #b6d98a; }
.grade-1 .card-symbol { color: #3B6D11; }
.grade-2 { background: #E6F1FB; border-color: #96c0e8; }
.grade-2 .card-symbol { color: #185FA5; }
.grade-3 { background: #EDE9FE; border-color: #b39dda; }
.grade-3 .card-symbol { color: #6D28D9; }
.grade-4 { background: #FAEEDA; border-color: #d4a843; }
.grade-4 .card-symbol { color: #854F0B; }

body.dark .grade-1 { background: #162508; border-color: #3a5a1a; }
body.dark .grade-1 .card-symbol { color: #7bc444; }
body.dark .grade-2 { background: #081828; border-color: #1a4060; }
body.dark .grade-2 .card-symbol { color: #5ba3e0; }
body.dark .grade-3 { background: #1e1535; border-color: #5a35a0; }
body.dark .grade-3 .card-symbol { color: #a87de8; }
body.dark .grade-4 { background: #2e200a; border-color: #8a5a1a; }
body.dark .grade-4 .card-symbol { color: #c8a040; }

/* Builder */
#selected-preview {
  display: flex; flex-wrap: wrap; gap: 5px; min-height: 36px;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  padding: 6px 8px; margin-bottom: 8px;
}
.selected-chip {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 99px; padding: 1px 8px;
  font-size: 11px; color: var(--color-text-secondary);
}
#compound-list {
  display: flex; flex-direction: column; gap: 5px;
  max-height: 200px; overflow-y: auto; margin-bottom: 8px;
}
.compound-option {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md); padding: 6px 10px;
  cursor: pointer; transition: border-color 0.1s;
}
.compound-option:hover { border-color: var(--color-border-secondary); background: var(--color-background-primary); }
.compound-option .comp-name { font-size: 13px; color: var(--color-text-primary); }
.compound-option .comp-formula { font-size: 12px; color: var(--color-text-tertiary); }
.compound-option .comp-score { font-size: 13px; color: #854F0B; font-weight: 600; }
body.dark .compound-option .comp-score { color: #c8a040; }
.comp-category {
  font-size: 10px; padding: 1px 5px; border-radius: 99px;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-secondary);
  color: var(--color-text-tertiary); margin-left: 5px;
}
#builder-hint { font-size: 11px; color: var(--color-text-tertiary); }

/* Formed compounds */
#formed-list { display: flex; flex-direction: column; gap: 5px; }
.formed-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md); padding: 6px 10px;
}
.formed-item .fi-left { display: flex; align-items: center; gap: 8px; }
.formed-item .fi-name { font-size: 13px; color: var(--color-text-primary); }
.formed-item .fi-formula { font-size: 11px; color: var(--color-text-tertiary); }
.formed-item .fi-score { font-size: 13px; color: #854F0B; font-weight: 600; }
body.dark .formed-item .fi-score { color: #c8a040; }

/* Board area */
#board-area { border-color: #d4edcc; }
body.dark #board-area { border-color: #1a3a1a; }
#board-area h3 { color: #3B6D11 !important; }
body.dark #board-area h3 { color: #7bc444 !important; }
#board-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
.board-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md); padding: 6px 10px;
  transition: border-color 0.1s;
}
.board-item.clickable { cursor: pointer; }
.board-item.clickable:hover { border-color: #3B6D11; }
.board-item.selected { border: 1.5px solid #378ADD; background: #E6F1FB; }
body.dark .board-item.selected { background: #081828; border-color: #5ba3e0; }
#board-hint { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 6px; }
#board-reaction-list { display: flex; flex-direction: column; gap: 5px; }
.reaction-option {
  display: flex; justify-content: space-between; align-items: center;
  background: #EAF3DE; border: 0.5px solid #b6d98a;
  border-radius: var(--border-radius-md); padding: 6px 10px;
  cursor: pointer; font-size: 12px; color: #3B6D11;
  transition: border-color 0.1s;
}
.reaction-option:hover { border-color: #3B6D11; }
body.dark .reaction-option { background: #162508; border-color: #3a5a1a; color: #7bc444; }

/* Action buttons */
#action-bar { display: flex; gap: 8px; margin-top: 6px; }
button {
  padding: 9px 14px;
  border-radius: var(--border-radius-md);
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  font-size: 13px; font-weight: 500; color: var(--color-text-primary);
  cursor: pointer; transition: background 0.1s, opacity 0.1s;
}
button:hover:not(:disabled) { background: var(--color-background-secondary); }
button:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-primary { background: #378ADD; color: #fff; border: none; flex: 1; }
.btn-primary:hover:not(:disabled) { background: #2A72B7; }
.btn-danger { color: #E24B4A; border-color: #E24B4A; }
.btn-success { background: #1D9E75; color: #fff; border: none; }
.btn-warning { background: #B8860B; color: #fff; border: none; }

/* Score panel */
.score-line {
  display: flex; justify-content: space-between;
  font-size: 12px; padding: 5px 0;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}
.score-line:last-child { border-bottom: none; }
.score-line .sl-label { color: var(--color-text-secondary); }
.score-line .sl-value { font-weight: 600; color: var(--color-text-primary); }
.score-line .sl-value.pass { color: #1D9E75; }
.score-line .sl-value.fail { color: #E24B4A; }

/* Log area */
#log-area { max-height: 200px; overflow-y: auto; }
.log-line { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 3px; line-height: 1.5; }
.log-line.bonus { color: #185FA5; }
body.dark .log-line.bonus { color: #5ba3e0; }
.log-line.error { color: #E24B4A; }

/* Shop */
#shop-area { display: none; }
#shop-area.visible { display: block; }
#shop-area h3 { color: #854F0B !important; }
body.dark #shop-area h3 { color: #c8a040 !important; }
#shop-cards { display: flex; flex-direction: column; gap: 6px; }
.shop-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md); padding: 8px 10px;
  cursor: pointer; transition: border-color 0.1s;
}
.shop-item:hover { border-color: var(--color-border-secondary); background: var(--color-background-primary); }
.shop-item.bought { opacity: 0.38; pointer-events: none; }
.shop-item .si-sym { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.shop-item .si-name { font-size: 11px; color: var(--color-text-secondary); }
.shop-item .si-cost { font-size: 12px; color: #854F0B; font-weight: 600; }
body.dark .shop-item .si-cost { color: #c8a040; }
.shop-item .si-num { font-size: 10px; color: var(--color-text-tertiary); }

/* Synergy overlay */
#synergy-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 200; align-items: center; justify-content: center; flex-direction: column;
}
#synergy-overlay.visible { display: flex; }
.synergy-box {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 24px 28px; text-align: center;
  max-width: 560px; width: 90%;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
.synergy-box h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
.synergy-box p { color: var(--color-text-secondary); font-size: 13px; margin-bottom: 16px; }
#synergy-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.synergy-card {
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
  padding: 16px 12px; width: 160px;
  text-align: center; cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
  color: var(--color-text-primary);
}
.synergy-card:hover:not(.maxed) { border-color: #378ADD; transform: translateY(-3px); }
.synergy-card.maxed { border-color: #B8860B; opacity: 0.85; }

/* Game over / Phase overlay */
#phase-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 100;
  align-items: center; justify-content: center;
}
#phase-overlay.visible { display: flex; }
.overlay-box {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  padding: 2rem 2.5rem; text-align: center; max-width: 400px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  color: var(--color-text-primary);
}
.overlay-box h2 { font-size: 20px; font-weight: 500; margin-bottom: 12px; }
.overlay-box p { color: var(--color-text-secondary); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
.overlay-box.gameover { border-color: #E24B4A; }
.overlay-box.gameover h2 { color: #E24B4A; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 2px; }

@media (max-width: 700px) {
  #main { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
<button id="dark-toggle" onclick="toggleDark()" title="다크/라이트 모드 전환">🌙</button>
<div id="app">

    <h1>⚗️ Elemental Forge</h1>
    <div class="stat-box">
      <div class="stat">
        <div class="stat-label">턴</div>
        <div class="stat-value" id="turn-val">1</div>

      </div>
      <div class="stat">
        <div class="stat-label">이번 턴 점수</div>
        <div class="stat-value danger" id="score-val">0pt</div>

        <div class="stat-label">토큰</div>

  </div>
  <div id="main">
    <div id="left-panel">
      <div id="hand-area">
        <h3>🃏 현재 손패</h3>

      </div>
      <div id="builder-area">
        <h3>🧪 화합물 합성</h3>

      </div>
      <div id="formed-area">
        <h3>✅ 이번 턴 합성된 화합물</h3>

      </div>

        <h3>🗂️ 보드 (라운드 내 지속)</h3>

        <div id="board-hint"></div>
        <div id="board-reaction-list"></div>
      </div>
    </div>
    <div id="right-panel">
      <div id="score-panel">
        <h3>📊 득점 현황</h3>
        <div id="score-lines"></div>
      </div>
      <div id="log-area">
        <h3>📋 로그</h3>
        <div id="log-lines"></div>
      </div>
      <div id="shop-area">
        <h3>🛒 원소 상점</h3>
        <p style="font-size:0.75rem;color:#888;margin-bottom:10px">토큰으로 새 원소 카드 구매 (덱에 추가)</p>
        <div id="shop-cards"></div>
      </div>
    </div>
  </div>
</div>

<!-- Synergy pick overlay -->
<div id="synergy-overlay">
  <div class="synergy-box">
    <h2>🧬 시너지 선택</h2>
    <p>이번 턴 해금/강화할 시너지를 선택하세요</p>
    <div id="synergy-options"></div>
  </div>
</div>

<!-- Game over overlay -->
<div id="phase-overlay">
  <div class="overlay-box">
    <h2 id="overlay-title">게임 오버</h2>
    <p id="overlay-msg"></p>
    <button class="btn-primary" id="overlay-btn">다시 시작</button>
  </div>
</div>

<script>
function toggleDark() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('dark-toggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('dark', isDark ? '1' : '');
}
(function() {
  if (localStorage.getItem('dark')) {
    document.body.classList.add('dark');
    const btn = document.getElementById('dark-toggle');
    if (btn) btn.textContent = '☀️';
  }
})();

// ── engine.js ─────────────────────────────────────────────────────────────────

class GameState {
  constructor() {
    this.turn = 1;
    this.tokens = 0;
    this.totalTokensEarned = 0;
    this.tokensThisTurn = 0;
    this.deck = this.buildInitialDeck();
    this.hand = [];
    this.discard = [];
    this.formedCompounds = [];
    this.boardCompounds = [];
    this.usedElementIds = new Set();
    this.turnScore = 0;
    this.log = [];
    this.gameOver = false;
    this.phase = 'draw';
    this.shopCards = [];
    this.interactionsThisTurn = new Set();
    this.bonusLines = [];
    this.roundScore = 0;
    this.roundTurn = 0;
    this.roundNum = 1;
    this.unlockedSynergies = {};
    this.synergyPickOptions = [];
  }

  buildInitialDeck() {
    const cards = [];
    let id = 0;
    const add = (sym, count) => {
      for (let i = 0; i < count; i++) cards.push({ id: id++, symbol: sym });
    };
    add('H', 5);
    add('C', 4);
    add('O', 3);
    return shuffle(cards);
  }

  getRoundThreshold() {
    const idx = Math.min(this.roundNum - 1, ROUND_THRESHOLDS.length - 1);
    if (this.roundNum <= ROUND_THRESHOLDS.length) return ROUND_THRESHOLDS[idx];
    let t = ROUND_THRESHOLDS[ROUND_THRESHOLDS.length - 1];
    for (let i = ROUND_THRESHOLDS.length; i < this.roundNum; i++) t = Math.round(t * 2.0);
    return t;
  }

  drawPhase() {
    if (this.deck.length < 8) {
      this.deck = shuffle([...this.deck, ...this.discard]);
      this.discard = [];
    }
    this.hand = this.deck.splice(0, 8);
    this.formedCompounds = [];
    this.usedElementIds = new Set();
    this.turnScore = 0;
    this.tokensThisTurn = 0;
    this.interactionsThisTurn = new Set();
    this.bonusLines = [];
    this.log = [];
    this.phase = 'build';
  }

  formCompound(cardIds, compoundId) {
    const compound = COMPOUNDS.find(c => c.id === compoundId);
    if (!compound) return { ok: false, msg: '알 수 없는 화합물' };

    for (const id of cardIds) {
      if (this.usedElementIds.has(id)) return { ok: false, msg: '이미 사용된 카드' };
    }

    const selectedCards = this.hand.filter(c => cardIds.includes(c.id));
    const symbolCount = {};
    for (const card of selectedCards) {
      symbolCount[card.symbol] = (symbolCount[card.symbol] || 0) + 1;
    }

    for (const [sym, needed] of Object.entries(compound.elements)) {
      if ((symbolCount[sym] || 0) < needed) {
        return { ok: false, msg: `${sym} 부족 (필요: ${needed})` };
      }
    }
    const totalNeeded = Object.values(compound.elements).reduce((a, b) => a + b, 0);
    if (cardIds.length !== totalNeeded) {
      return { ok: false, msg: `카드 수 불일치 (필요: ${totalNeeded}장)` };
    }

    for (const id of cardIds) this.usedElementIds.add(id);

    const existing = this.formedCompounds.find(fc => fc.compound.id === compoundId);
    if (existing) existing.count++;
    else this.formedCompounds.push({ compound, count: 1 });

    const boardExisting = this.boardCompounds.find(bc => bc.compound.id === compoundId);
    if (boardExisting) boardExisting.count++;
    else this.boardCompounds.push({ compound, count: 1 });

    this.log.push(`✅ ${compound.name} (${compound.formula}) 합성! 기본 ${compound.score}점`);
    return { ok: true };
  }

  getValidBoardReactions(selectedCompoundIds) {
    const selectedCounts = {};
    for (const id of selectedCompoundIds) {
      selectedCounts[id] = (selectedCounts[id] || 0) + 1;
    }
    const boardCounts = {};
    for (const bc of this.boardCompounds) boardCounts[bc.compound.id] = bc.count;

    return BOARD_REACTIONS.filter(r => {
      const needed = {};
      for (const reactant of r.reactants) needed[reactant] = (needed[reactant] || 0) + 1;
      if (Object.keys(needed).length !== Object.keys(selectedCounts).length) return false;
      for (const [id, count] of Object.entries(needed)) {
        if ((selectedCounts[id] || 0) !== count) return false;
        if ((boardCounts[id] || 0) < count) return false;
      }
      return true;
    });
  }

  executeBoardReaction(reactionId) {
    const reaction = BOARD_REACTIONS.find(r => r.id === reactionId);
    if (!reaction) return { ok: false, msg: '알 수 없는 반응' };

    const needed = {};
    for (const reactant of reaction.reactants) needed[reactant] = (needed[reactant] || 0) + 1;
    for (const [id, count] of Object.entries(needed)) {
      const bc = this.boardCompounds.find(b => b.compound.id === id);
      if (!bc || bc.count < count) return { ok: false, msg: `${id} 부족` };
    }

    for (const [id, count] of Object.entries(needed)) {
      const bc = this.boardCompounds.find(b => b.compound.id === id);
      bc.count -= count;
    }
    this.boardCompounds = this.boardCompounds.filter(b => b.count > 0);

    const productCompound = COMPOUNDS.find(c => c.id === reaction.product);
    if (productCompound) {
      const existing = this.boardCompounds.find(b => b.compound.id === reaction.product);
      if (existing) existing.count++;
      else this.boardCompounds.push({ compound: productCompound, count: 1 });
    }

    const tokenGain = TOKEN_REWARDS.boardReaction.perReaction + reaction.tokenBonus;
    this.tokens += tokenGain;
    this.totalTokensEarned += tokenGain;
    this.tokensThisTurn += tokenGain;
    this.log.push(`⚗️ 보드 반응: ${reaction.label} +${tokenGain}🪙`);
    return { ok: true, product: productCompound };
  }

  scorePhase() {
    if (this.formedCompounds.length === 0) {
      this.turnScore = 0;
      this.phase = 'interact';
      return;
    }

    const formed = this.formedCompounds;
    const compoundMap = {};
    for (const fc of formed) {
      compoundMap[fc.compound.id] = {
        compound: fc.compound,
        count: fc.count,
        baseScore: fc.compound.score * fc.count,
        bonusScore: 0,
        multiplier: 1.0,
      };
    }

    const allIds = new Set(formed.map(fc => fc.compound.id));
    const allCategories = formed.flatMap(fc => Array(fc.count).fill(fc.compound.category));

    if (this.unlockedSynergies.category_synergy) {
      const level = this.unlockedSynergies.category_synergy.level;
      const bonusTable = SYNERGY_POOL.category_synergy.levels[level - 1].bonusTable;
      const catCounts = {};
      for (const cat of allCategories) catCounts[cat] = (catCounts[cat] || 0) + 1;
      for (const [cat, bonus] of Object.entries(bonusTable)) {
        if ((catCounts[cat] || 0) >= 2) {
          this.interactionsThisTurn.add('category_synergy');
          for (const fc of formed.filter(f => f.compound.category === cat)) {
            const b = bonus * fc.count;
            compoundMap[fc.compound.id].bonusScore += b;
            this.bonusLines.push(`📦 분류 시너지 Lv${level} [${cat}]: ${fc.compound.name} +${b}pt`);
          }
        }
      }
    }

    if (this.unlockedSynergies.neutralization) {
      const level = this.unlockedSynergies.neutralization.level;
      const bonus = SYNERGY_POOL.neutralization.levels[level - 1].bonus;
      for (const pair of NEUTRALIZATION_PAIRS) {
        if (allIds.has(pair.acid) && allIds.has(pair.base)) {
          this.interactionsThisTurn.add('neutralization');
          compoundMap[pair.acid].bonusScore += bonus;
          compoundMap[pair.base].bonusScore += bonus;
          this.bonusLines.push(`⚗️ 중화 반응 Lv${level}: ${compoundMap[pair.acid].compound.name}+${compoundMap[pair.base].compound.name} 각 +${bonus}pt`);
        }
      }
    }

    for (const chain of REACTION_CHAINS) {
      if (chain.reactants.every(r => allIds.has(r))) {
        const product = COMPOUNDS.find(c => c.id === chain.product);
        if (product && !allIds.has(product.id)) {
          this.interactionsThisTurn.add('reaction_chain');
          const chainScore = Math.round(product.score * 0.5);
          if (!compoundMap[product.id]) {
            compoundMap[product.id] = { compound: product, count: 0, baseScore: 0, bonusScore: chainScore, multiplier: 1.0 };
          } else {
            compoundMap[product.id].bonusScore += chainScore;
          }
          this.bonusLines.push(`🔗 반응 연계 [${chain.label}]: +${chainScore}pt`);
        }
      }
    }

    if (this.unlockedSynergies.combustion) {
      const level = this.unlockedSynergies.combustion.level;
      const scale = SYNERGY_POOL.combustion.levels[level - 1].multiplierScale;
      const co2Count = (compoundMap['CO2']?.count || 0);
      const h2oCount = (compoundMap['H2O']?.count || 0);
      for (const rule of COMBUSTION_RULES) {
        if (allIds.has(rule.organic) && co2Count >= rule.co2 && h2oCount >= rule.h2o) {
          this.interactionsThisTurn.add('combustion');
          const entry = compoundMap[rule.organic];
          const m = 1 + (rule.multiplier - 1) * scale;
          entry.multiplier *= m;
          this.bonusLines.push(`🔥 연소 반응 Lv${level}: ${entry.compound.name} ×${m.toFixed(2)}`);
        }
      }
    }

    if (this.unlockedSynergies.catalyst) {
      const level = this.unlockedSynergies.catalyst.level;
      const targetScale = SYNERGY_POOL.catalyst.levels[level - 1].targetScale;
      for (const rule of CATALYST_RULES) {
        if (allIds.has(rule.catalyst)) {
          this.interactionsThisTurn.add('catalyst');
          const catalystEntry = compoundMap[rule.catalyst];
          catalystEntry.multiplier *= 0.5;
          for (const entry of Object.values(compoundMap)) {
            if (entry.compound.id !== rule.catalyst && rule.targets.includes(entry.compound.category)) {
              const m = 1 + (rule.multiplier - 1) * targetScale;
              entry.multiplier *= m;
              this.bonusLines.push(`⚡ 촉매 Lv${level} [${catalystEntry.compound.name}→${entry.compound.name}] ×${m.toFixed(2)}`);
            }
          }
        }
      }
    }

    if (this.unlockedSynergies.homologous_series) {
      const level = this.unlockedSynergies.homologous_series.level;
      const bonusScale = SYNERGY_POOL.homologous_series.levels[level - 1].bonusScale;
      for (const series of HOMOLOGOUS_SERIES) {
        const matches = series.ids.filter(id => allIds.has(id));
        if (matches.length >= 2) {
          this.interactionsThisTurn.add('homologous_series');
          const mult = matches.length >= 3 ? 2 : 1;
          for (const id of matches) {
            const b = Math.round(series.bonus * mult * bonusScale * (compoundMap[id]?.count || 1));
            if (compoundMap[id]) compoundMap[id].bonusScore += b;
            this.bonusLines.push(`🧬 동족열 Lv${level} [${series.name}]: ${COMPOUNDS.find(c => c.id === id)?.name} +${b}pt`);
          }
        }
      }
    }

    const comboCount = this.interactionsThisTurn.size;
    const COMBO_MULT = [1.0, 1.0, 1.2, 1.5, 1.8, 2.5];
    const comboMult = COMBO_MULT[Math.min(comboCount, COMBO_MULT.length - 1)];
    if (comboCount >= 2) {
      this.bonusLines.push(`✨ 콤보 배율 (${comboCount}종): ×${comboMult}`);
    }

    let total = 0;
    for (const entry of Object.values(compoundMap)) {
      total += Math.round((entry.baseScore + entry.bonusScore) * entry.multiplier);
    }
    this.turnScore = Math.round(total * comboMult);

    let compoundTokens = 0;
    for (const fc of formed) {
      compoundTokens += (TOKEN_REWARDS.compound[`grade${fc.compound.grade}`] || 0) * fc.count;
    }
    const interactionTokens = this.interactionsThisTurn.size * TOKEN_REWARDS.interaction.perInteraction;
    const totalTokenGain = compoundTokens + interactionTokens;
    if (totalTokenGain > 0) {
      this.tokens += totalTokenGain;
      this.totalTokensEarned += totalTokenGain;
      this.tokensThisTurn += totalTokenGain;
      this.bonusLines.push(`🪙 +${totalTokenGain} 토큰 (화합물 ${compoundTokens} + 상호작용 ${interactionTokens})`);
    }

    for (const card of this.hand) this.discard.push(card);
    this.phase = 'interact';
  }

  judgePhase() {
    this.roundScore += this.turnScore;
    this.roundTurn++;

    if (this.roundTurn === 5) {
      const target = this.getRoundThreshold();
      if (this.roundScore >= target) {
        const bonusTokens = Math.floor((this.roundScore - target) * 0.1);
        this.tokens += bonusTokens;
        this.totalTokensEarned += bonusTokens;
        this.log.push(`🎉 ${this.roundNum}라운드 통과! 누적 ${this.roundScore}pt / 목표 ${target}pt`);
        if (bonusTokens > 0) this.log.push(`💰 초과 득점 보너스: +${bonusTokens}🪙`);
        this.roundNum++;
        this.roundScore = 0;
        this.roundTurn = 0;
        this.boardCompounds = [];
      } else {
        this.log.push(`💀 ${this.roundNum}라운드 실패. 누적 ${this.roundScore}pt / 목표 ${target}pt`);
        this.gameOver = true;
        this.phase = 'gameover';
        return;
      }
    } else {
      const target = this.getRoundThreshold();
      const remaining = 5 - this.roundTurn;
      this.log.push(`📈 이번 턴 ${this.turnScore}pt → 라운드 누적 ${this.roundScore}pt (목표 ${target}pt, 남은 턴 ${remaining})`);
    }

    this._generateSynergyOptions();
    this.phase = 'synergy_pick';
  }

  _generateSynergyOptions() {
    this.synergyPickOptions = shuffle([...Object.keys(SYNERGY_POOL)]).slice(0, 3);
  }

  pickSynergy(key) {
    const synergy = SYNERGY_POOL[key];
    if (!synergy) return;
    if (!this.unlockedSynergies[key]) {
      this.unlockedSynergies[key] = { level: 1 };
      this.log.push(`🔓 ${synergy.name} 해금! (Lv1)`);
    } else if (this.unlockedSynergies[key].level < 3) {
      this.unlockedSynergies[key].level++;
      this.log.push(`⬆️ ${synergy.name} 업그레이드! (Lv${this.unlockedSynergies[key].level})`);
    } else {
      this.tokens += 5;
      this.totalTokensEarned += 5;
      this.log.push(`✨ ${synergy.name} 이미 최대 레벨! +5🪙`);
    }
    this.generateShop();
    this.phase = 'shop';
  }

  generateShop() {
    const maxGrade = this.roundNum >= 3 ? 4 : this.roundNum >= 2 ? 3 : 2;
    const pool = Object.entries(ELEMENTS)
      .filter(([, el]) => el.grade >= 2 && el.grade <= maxGrade)
      .map(([sym]) => sym);
    this.shopCards = shuffle([...pool]).slice(0, 3).map(sym => ({
      symbol: sym,
      element: ELEMENTS[sym],
      cost: SHOP_COSTS[ELEMENTS[sym].grade],
    }));
  }

  buyCard(symbol) {
    const shopItem = this.shopCards.find(c => c.symbol === symbol);
    if (!shopItem) return { ok: false, msg: '상점에 없는 원소' };
    if (this.tokens < shopItem.cost) return { ok: false, msg: '토큰 부족' };
    this.tokens -= shopItem.cost;
    this.discard.push({ id: Date.now() + Math.random(), symbol });
    this.log.push(`🛒 ${ELEMENTS[symbol].name}(${symbol}) 획득!`);
    this.shopCards = this.shopCards.filter(c => c.symbol !== symbol);
    return { ok: true };
  }

  nextTurn() {
    this.turn++;
    this.hand = [];
    this.phase = 'draw';
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── ui.js ─────────────────────────────────────────────────────────────────────

let gs = null;
let selectedCardIds = [];
let selectedBoardIds = [];

function init() {
  gs = new GameState();
  gs.drawPhase();
  render();
}

function render() {
  renderHeader();
  renderHand();
  renderBuilder();
  renderFormed();
  renderBoard();
  renderLog();
  renderScore();
  renderShop();
  renderSynergyPick();
  renderActions();
}

function renderHeader() {
  document.getElementById('turn-val').textContent = gs.turn;
  const target = gs.getRoundThreshold();
  document.getElementById('threshold-val').textContent = `${gs.roundScore}/${target}pt`;
  document.getElementById('token-val').textContent = gs.tokens + '🪙';
  const sv = document.getElementById('score-val');
  sv.textContent = gs.turnScore + 'pt';
  const turnsLeft = 5 - gs.roundTurn;
  const needed = target - gs.roundScore;
  const onTrack = turnsLeft > 0 ? (needed / turnsLeft <= 80) : gs.roundScore >= target;
  sv.className = 'stat-value ' + (onTrack ? 'ok' : 'danger');
}

function renderHand() {
  const container = document.getElementById('hand-cards');
  container.innerHTML = '';
  for (const card of gs.hand) {
    const el = ELEMENTS[card.symbol];
    const div = document.createElement('div');
    const isUsed = gs.usedElementIds.has(card.id);
    const isSelected = selectedCardIds.includes(card.id);
    div.className = `element-card grade-${el.grade}${isUsed ? ' used' : ''}${isSelected ? ' selected' : ''}`;
    div.innerHTML = `
      <span class="card-symbol">${card.symbol}</span>
      <span class="card-name">${el.name}</span>
      <span class="card-num">${el.atomicNum}</span>
    `;
    if (!isUsed) div.addEventListener('click', () => toggleCard(card.id));
    container.appendChild(div);
  }
  if (gs.hand.length === 0 && gs.phase === 'build') {
    container.innerHTML = '<span style="color:#555;font-size:0.8rem">카드가 없습니다.</span>';
  }
}

function toggleCard(cardId) {
  if (gs.phase !== 'build') return;
  const idx = selectedCardIds.indexOf(cardId);
  if (idx >= 0) selectedCardIds.splice(idx, 1);
  else selectedCardIds.push(cardId);
  renderBuilder();
  renderHand();
}

function renderBuilder() {
  const preview = document.getElementById('selected-preview');
  const compoundList = document.getElementById('compound-list');
  const hint = document.getElementById('builder-hint');

  preview.innerHTML = '';
  const symCount = {};
  for (const id of selectedCardIds) {
    const card = gs.hand.find(c => c.id === id);
    if (card) symCount[card.symbol] = (symCount[card.symbol] || 0) + 1;
  }
  if (selectedCardIds.length === 0) {
    preview.innerHTML = '<span style="color:#444;font-size:0.75rem">카드를 선택하세요</span>';
  }
  for (const [sym, cnt] of Object.entries(symCount)) {
    const chip = document.createElement('span');
    chip.className = 'selected-chip';
    chip.textContent = cnt > 1 ? `${sym}×${cnt}` : sym;
    preview.appendChild(chip);
  }

  compoundList.innerHTML = '';
  if (selectedCardIds.length === 0) {
    hint.textContent = '카드를 선택하면 만들 수 있는 화합물이 표시됩니다.';
    return;
  }

  const total = Object.values(symCount).reduce((a, b) => a + b, 0);
  const available = COMPOUNDS.filter(c => {
    const needed = Object.values(c.elements).reduce((a, b) => a + b, 0);
    if (needed !== total) return false;
    for (const [sym, cnt] of Object.entries(c.elements)) {
      if ((symCount[sym] || 0) < cnt) return false;
    }
    return true;
  });

  if (available.length === 0) {
    hint.textContent = '선택한 카드로 만들 수 있는 화합물이 없습니다.';
    return;
  }
  hint.textContent = '아래 화합물 중 하나를 클릭해 합성하세요.';

  for (const c of available) {
    const div = document.createElement('div');
    div.className = 'compound-option';
    div.innerHTML = `
      <div class="fi-left">
        <span class="comp-name">${c.name}</span>
        <span class="comp-formula">${c.formula}</span>
        <span class="comp-category">${getCatLabel(c.category)}</span>
      </div>
      <span class="comp-score">${c.score}pt</span>
    `;
    div.addEventListener('click', () => formCompound(c.id));
    compoundList.appendChild(div);
  }
}

function formCompound(compoundId) {
  if (gs.phase !== 'build') return;
  const result = gs.formCompound(selectedCardIds, compoundId);
  if (!result.ok) {
    addLogLine('❌ ' + result.msg, 'error');
    return;
  }
  selectedCardIds = [];
  renderLog();
  renderHand();
  renderBuilder();
  renderFormed();
  renderBoard();
  renderActions();
}

function renderFormed() {
  const list = document.getElementById('formed-list');
  list.innerHTML = '';
  if (gs.formedCompounds.length === 0) {
    list.innerHTML = '<span style="color:#555;font-size:0.8rem">아직 합성한 화합물이 없습니다.</span>';
    return;
  }
  for (const fc of gs.formedCompounds) {
    const div = document.createElement('div');
    div.className = 'formed-item';
    div.innerHTML = `
      <div class="fi-left">
        <span class="fi-name">${fc.compound.name}</span>
        <span class="fi-formula">${fc.compound.formula}</span>
        ${fc.count > 1 ? `<span style="color:#f0d060;font-size:0.75rem">×${fc.count}</span>` : ''}
      </div>
      <span class="fi-score">${fc.compound.score * fc.count}pt</span>
    `;
    list.appendChild(div);
  }
}

function renderBoard() {
  const boardList = document.getElementById('board-list');
  const boardHint = document.getElementById('board-hint');
  const reactionList = document.getElementById('board-reaction-list');

  boardList.innerHTML = '';
  reactionList.innerHTML = '';

  if (gs.boardCompounds.length === 0) {
    boardList.innerHTML = '<span style="color:#555;font-size:0.8rem">보드가 비어있습니다.</span>';
    boardHint.textContent = '';
    return;
  }

  const inInteract = gs.phase === 'interact';

  for (const bc of gs.boardCompounds) {
    const div = document.createElement('div');
    const isSelected = selectedBoardIds.includes(bc.compound.id);
    div.className = 'board-item' + (isSelected ? ' selected' : '') + (inInteract ? ' clickable' : '');
    div.innerHTML = `
      <div class="fi-left">
        <span class="fi-name">${bc.compound.name}</span>
        <span class="fi-formula">${bc.compound.formula}</span>
        ${bc.count > 1 ? `<span style="color:#6bff8a;font-size:0.75rem">×${bc.count}</span>` : ''}
      </div>
      <span class="fi-score" style="color:#6bff8a">${bc.compound.score}pt</span>
    `;
    if (inInteract) div.addEventListener('click', () => toggleBoardItem(bc.compound.id));
    boardList.appendChild(div);
  }

  if (!inInteract) {
    boardHint.textContent = '채점 후 반응 단계에서 보드 화합물을 선택할 수 있습니다.';
    return;
  }

  if (selectedBoardIds.length === 0) {
    boardHint.textContent = '반응시킬 화합물 2개를 선택하세요.';
    return;
  }

  const validReactions = gs.getValidBoardReactions(selectedBoardIds);
  if (validReactions.length === 0) {
    boardHint.textContent = '선택한 조합으로 가능한 반응이 없습니다.';
    return;
  }

  boardHint.textContent = '아래 반응 중 하나를 클릭하세요.';
  for (const r of validReactions) {
    const div = document.createElement('div');
    div.className = 'reaction-option';
    div.innerHTML = `
      <span>${r.label}</span>
      <span style="color:#6bff8a">+${TOKEN_REWARDS.boardReaction.perReaction + r.tokenBonus}🪙</span>
    `;
    div.addEventListener('click', () => {
      const result = gs.executeBoardReaction(r.id);
      if (result.ok) {
        selectedBoardIds = [];
        renderHeader();
        renderBoard();
        renderLog();
      }
    });
    reactionList.appendChild(div);
  }
}

function toggleBoardItem(compoundId) {
  if (gs.phase !== 'interact') return;
  const idx = selectedBoardIds.indexOf(compoundId);
  if (idx >= 0) selectedBoardIds.splice(idx, 1);
  else selectedBoardIds.push(compoundId);
  renderBoard();
}

function renderSynergyPick() {
  const overlay = document.getElementById('synergy-overlay');
  if (gs.phase !== 'synergy_pick') {
    overlay.classList.remove('visible');
    return;
  }
  overlay.classList.add('visible');

  const optionsEl = document.getElementById('synergy-options');
  optionsEl.innerHTML = '';

  for (const key of gs.synergyPickOptions) {
    const synergy = SYNERGY_POOL[key];
    const current = gs.unlockedSynergies[key];
    const currentLevel = current ? current.level : 0;
    const isMaxed = currentLevel >= 3;

    const card = document.createElement('div');
    card.className = 'synergy-card' + (isMaxed ? ' maxed' : '');

    const levelDots = [1, 2, 3].map(l =>
      `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px;background:${l <= currentLevel ? '#7ec8e3' : '#2a2a4a'}"></span>`
    ).join('');

    card.innerHTML = `
      <div style="font-size:1.8rem">${synergy.icon}</div>
      <div style="font-weight:bold;margin:6px 0;font-size:0.9rem">${synergy.name}</div>
      <div style="margin-bottom:8px">${levelDots}</div>
      <div style="font-size:0.7rem;color:#aaa;margin-bottom:8px">${synergy.description}</div>
      <div style="font-size:0.75rem;color:${isMaxed ? '#f0d060' : '#6bff8a'}">
        ${isMaxed ? '최대 레벨 (+5🪙)' : currentLevel === 0 ? '해금 (Lv1)' : `Lv${currentLevel} → Lv${currentLevel + 1}`}
      </div>
    `;
    card.addEventListener('click', () => {
      gs.pickSynergy(key);
      render();
    });
    optionsEl.appendChild(card);
  }
}

function renderLog() {
  const logArea = document.getElementById('log-lines');
  logArea.innerHTML = '';
  for (const line of gs.log) addLogLine(line);
  for (const line of gs.bonusLines) addLogLine(line, 'bonus');
  logArea.scrollTop = logArea.scrollHeight;
}

function addLogLine(text, cls = '') {
  const logArea = document.getElementById('log-lines');
  const div = document.createElement('div');
  div.className = 'log-line ' + cls;
  div.textContent = text;
  logArea.appendChild(div);
  logArea.scrollTop = logArea.scrollHeight;
}

function renderScore() {
  const panel = document.getElementById('score-lines');
  panel.innerHTML = '';

  const target = gs.getRoundThreshold();
  const addLine = (label, value, cls = '') => {
    const div = document.createElement('div');
    div.className = 'score-line';
    div.innerHTML = `<span class="sl-label">${label}</span><span class="sl-value ${cls}">${value}</span>`;
    panel.appendChild(div);
  };

  addLine(`${gs.roundNum}라운드 목표`, target + 'pt');
  addLine('라운드 누적', gs.roundScore + 'pt', gs.roundScore >= target ? 'pass' : '');
  addLine('라운드 내 턴', `${gs.roundTurn}/5`);

  if (gs.phase === 'build' || gs.phase === 'interact') {
    const base = gs.formedCompounds.reduce((s, fc) => s + fc.compound.score * fc.count, 0);
    addLine('이번 턴 기본 점수', base + 'pt');
  }
  if (['interact', 'synergy_pick', 'shop'].includes(gs.phase)) {
    addLine('이번 턴 득점', gs.turnScore + 'pt');
    addLine('보유 토큰', gs.tokens + '🪙');
  }

  const unlockedKeys = Object.keys(gs.unlockedSynergies);
  if (unlockedKeys.length > 0) {
    const div = document.createElement('div');
    div.style.cssText = 'font-size:0.7rem;color:#7ec8e3;padding:4px 0;border-top:1px solid #2a2a4a;margin-top:4px';
    div.textContent = '해금: ' + unlockedKeys.map(k =>
      `${SYNERGY_POOL[k].icon}${SYNERGY_POOL[k].name} Lv${gs.unlockedSynergies[k].level}`
    ).join(', ');
    panel.appendChild(div);
  }

  if (gs.interactionsThisTurn.size > 0) {
    addLine('발동 상호작용', gs.interactionsThisTurn.size + '종');
    const div = document.createElement('div');
    div.style.cssText = 'font-size:0.7rem;color:#7ec8e3;padding:4px 0;';
    div.textContent = [...gs.interactionsThisTurn].map(i => getInteractionName(i)).join(', ');
    panel.appendChild(div);
  }
}

function renderShop() {
  const shopArea = document.getElementById('shop-area');
  const shopCards = document.getElementById('shop-cards');
  shopCards.innerHTML = '';

  if (gs.phase !== 'shop') {
    shopArea.classList.remove('visible');
    return;
  }
  shopArea.classList.add('visible');

  if (gs.shopCards.length === 0) {
    shopCards.innerHTML = '<span style="color:#555;font-size:0.8rem">상점이 비었습니다.</span>';
    return;
  }

  for (const item of gs.shopCards) {
    const div = document.createElement('div');
    div.className = 'shop-item';
    const canAfford = gs.tokens >= item.cost;
    if (!canAfford) div.style.opacity = '0.5';
    div.innerHTML = `
      <div class="fi-left">
        <span class="si-sym grade-${item.element.grade}" style="padding:2px 6px;border-radius:4px">${item.symbol}</span>
        <span class="si-name">${item.element.name}</span>
        <span class="si-num">Z=${item.element.atomicNum} | Grade ${item.element.grade}</span>
      </div>
      <span class="si-cost">${item.cost}🪙</span>
    `;
    if (canAfford) {
      div.addEventListener('click', () => {
        const result = gs.buyCard(item.symbol);
        if (result.ok) {
          div.classList.add('bought');
          renderHeader();
          renderScore();
          renderLog();
        }
      });
    }
    shopCards.appendChild(div);
  }
}

function renderActions() {
  const bar = document.getElementById('action-bar');
  bar.innerHTML = '';

  if (gs.phase === 'draw') {
    bar.appendChild(makeBtn('카드 드로우 (8장)', 'btn-primary', () => {
      gs.drawPhase();
      render();
    }));
  } else if (gs.phase === 'build') {
    if (selectedCardIds.length > 0) {
      bar.appendChild(makeBtn('선택 해제', 'btn-danger', () => {
        selectedCardIds = [];
        renderBuilder();
        renderHand();
      }));
    }
    const endBtn = makeBtn('합성 완료 → 채점', 'btn-success', () => {
      selectedCardIds = [];
      gs.scorePhase();
      render();
    });
    endBtn.disabled = gs.formedCompounds.length === 0;
    bar.appendChild(endBtn);
  } else if (gs.phase === 'interact') {
    if (selectedBoardIds.length > 0) {
      bar.appendChild(makeBtn('보드 선택 해제', 'btn-danger', () => {
        selectedBoardIds = [];
        renderBoard();
      }));
    }
    bar.appendChild(makeBtn('반응 완료 (다음 단계)', 'btn-success', () => {
      selectedBoardIds = [];
      gs.judgePhase();
      render();
    }));
  } else if (gs.phase === 'shop') {
    bar.appendChild(makeBtn('다음 턴', 'btn-warning', () => {
      gs.nextTurn();
      gs.drawPhase();
      render();
    }));
  } else if (gs.phase === 'gameover') {
    showGameOver();
  }
}

function makeBtn(label, cls, onClick) {
  const btn = document.createElement('button');
  btn.className = cls;
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function getCatLabel(cat) {
  const map = {
    oxide: '산화물', acid: '산', base: '염기', salt: '염',
    hydrocarbon: '탄화수소', alcohol: '알코올', organic_acid: '유기산',
    aldehyde: '알데하이드', ester: '에스터', sugar: '당류', oxidizer: '산화제',
  };
  return map[cat] || cat;
}

function getInteractionName(key) {
  const map = {
    category_synergy: '분류시너지', neutralization: '중화반응',
    reaction_chain: '반응연계', combustion: '연소반응',
    catalyst: '촉매', homologous_series: '동족열시너지',
  };
  return map[key] || key;
}

function showGameOver() {
  document.getElementById('overlay-title').textContent = '게임 오버';
  document.getElementById('overlay-msg').innerHTML =
    `${gs.roundNum}라운드 ${gs.turn}턴에 탈락했습니다.<br>총 획득한 토큰: ${gs.totalTokensEarned}🪙`;
  document.getElementById('overlay-btn').textContent = '다시 시작';
  document.getElementById('overlay-btn').onclick = () => {
    document.getElementById('phase-overlay').classList.remove('visible');
    init();
  };
  const box = document.querySelector('.overlay-box');
  box.classList.add('gameover');
  box.classList.remove('success');
  document.getElementById('phase-overlay').classList.add('visible');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
